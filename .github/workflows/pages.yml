
# Publică dashboard-ul pe GitHub Pages la fiecare push.
# Site static din rădăcina repo-ului: index.html citește data/state.json de pe
# aceeași origine, deci nu are nevoie de build, dependențe sau CORS.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true      # doar cea mai recentă versiune contează

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
